<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hunger Burgers - Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { base: '#F7E4B2', oscuro: '#3D2B1F', acento: '#C78D2B', danger: '#dc3545' },
          fontFamily: { sans: ['Quicksand', 'sans-serif'], display: ['Fredoka One', 'cursive'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #F7E4B2; color: #3D2B1F; font-family: 'Quicksand', sans-serif; -webkit-tap-highlight-color: transparent; }
    h1, h2, h3, .font-display { font-family: 'Fredoka One', cursive; font-weight: normal; }
    .loader { border-top-color: #C78D2B; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body x-data="menuApp()" x-init="init()" class="antialiased pb-24">

  <div x-show="vista === 'catalogo'" x-transition.opacity>
    
    <header class="bg-oscuro text-base py-12 px-4 text-center shadow-md relative overflow-hidden">
      <div class="relative z-10">
        <h1 class="text-4xl md:text-5xl tracking-wide mb-2 text-acento">HUNGER BURGERS</h1>
        <p class="text-md md:text-lg font-semibold tracking-widest opacity-90 mb-6">¿LISTO PARA EL PRIMER MORDISCO?</p>
        <div class="flex justify-center gap-4">
          <button @click="scrollMenu" class="bg-acento text-white px-6 py-2 rounded-md font-display tracking-wide shadow-lg hover:bg-yellow-600 transition">MENÚ</button>
          <button onclick="alert('Módulo de rastreo en desarrollo.')" class="border-2 border-acento text-acento px-6 py-2 rounded-md font-display tracking-wide hover:bg-acento hover:text-white transition">RASTREAR</button>
        </div>
      </div>
    </header>

    <div x-show="cargando" class="flex justify-center items-center py-20">
      <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
    </div>

    <main id="catalogo-grid" class="p-4 max-w-5xl mx-auto mt-6" x-show="!cargando">
      <template x-for="(cat, index) in categoriasUnicas" :key="index">
        <div class="mb-8">
          <h2 class="text-2xl font-display mb-4 border-b-2 border-oscuro pb-2 uppercase" x-text="cat"></h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <template x-for="prod in productos.filter(p => p.categoria === cat)" :key="prod.nombre">
              <div class="bg-white rounded-xl shadow-sm border border-[#e5d4a5] p-4 flex flex-col justify-between hover:shadow-md transition">
                <div>
                  <h3 class="text-lg font-display text-oscuro mb-1" x-text="prod.nombre"></h3>
                  <p class="text-acento font-bold text-xl mb-3">$<span x-text="prod.precio.toLocaleString()"></span></p>
                </div>
                <button @click="agregar(prod)" class="w-full bg-oscuro text-white py-2 rounded-md font-bold hover:bg-gray-800 transition">AGREGAR</button>
              </div>
            </template>
          </div>
        </div>
      </template>
    </main>
  </div>

  <div x-show="vista === 'checkout'" x-transition.opacity class="p-4 max-w-2xl mx-auto pt-8">
    <button @click="vista = 'catalogo'" class="text-oscuro font-bold mb-4 flex items-center gap-2 hover:text-acento transition">
      <span>⬅️</span> Volver al Menú
    </button>
    
    <h2 class="text-3xl font-display mb-6">TU ORDEN</h2>

    <div class="bg-white rounded-xl shadow-sm p-4 mb-6">
      <template x-if="carrito.length === 0">
        <p class="text-center text-gray-500 py-4 font-bold">El carrito está vacío.</p>
      </template>
      <ul class="divide-y divide-gray-200">
        <template x-for="(item, index) in carrito" :key="index">
          <li class="py-3 flex justify-between items-center">
            <div class="flex-1">
              <p class="font-bold text-oscuro" x-text="item.nombre"></p>
              <p class="text-sm text-gray-500">$<span x-text="item.precio.toLocaleString()"></span> c/u</p>
            </div>
            <div class="flex items-center gap-3">
              <button @click="modificarCant(index, -1)" class="bg-gray-200 text-oscuro w-8 h-8 rounded-full font-bold hover:bg-gray-300">-</button>
              <span class="font-bold w-4 text-center" x-text="item.cant"></span>
              <button @click="modificarCant(index, 1)" class="bg-gray-200 text-oscuro w-8 h-8 rounded-full font-bold hover:bg-gray-300">+</button>
            </div>
          </li>
        </template>
      </ul>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-4 mb-6 space-y-4">
      <h3 class="font-display text-xl mb-2">DATOS DE ENTREGA</h3>
      
      <div>
        <label class="block text-sm font-bold mb-1">Tu Nombre *</label>
        <input type="text" x-model="cliente.nombre" class="w-full border border-gray-300 p-3 rounded-md focus:outline-none focus:border-acento focus:ring-1 focus:ring-acento" placeholder="Ej: Nicolás">
      </div>
      
      <div>
        <label class="block text-sm font-bold mb-1">Celular *</label>
        <input type="tel" x-model="cliente.celular" maxlength="10" class="w-full border border-gray-300 p-3 rounded-md focus:outline-none focus:border-acento focus:ring-1 focus:ring-acento" placeholder="3000000000">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1">¿Dónde comes?</label>
          <select x-model="cliente.tipo_pedido" class="w-full border border-gray-300 p-3 rounded-md bg-white">
            <option value="LOCAL">📍 En el local</option>
            <option value="PARA LLEVAR">🛍️ Para llevar</option>
            <option value="DOMICILIO">🛵 Domicilio</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">Pago</label>
          <select x-model="cliente.metodo_pago" class="w-full border border-gray-300 p-3 rounded-md bg-white">
            <option value="EFECTIVO">💵 Efectivo</option>
            <option value="NEQUI">📱 Nequi</option>
          </select>
        </div>
      </div>

      <div x-show="cliente.tipo_pedido === 'DOMICILIO'" x-transition>
        <label class="block text-sm font-bold mb-1">Dirección de entrega *</label>
        <input type="text" x-model="cliente.direccion" class="w-full border border-gray-300 p-3 rounded-md focus:outline-none focus:border-acento" placeholder="Carrera X # Y - Z">
      </div>

      <div>
        <label class="block text-sm font-bold mb-1">Notas (Opcional)</label>
        <textarea x-model="cliente.notas" rows="2" class="w-full border border-gray-300 p-3 rounded-md focus:outline-none focus:border-acento" placeholder="Sin cebolla, timbre malo..."></textarea>
      </div>
    </div>

    <div class="bg-oscuro text-base rounded-xl p-5 shadow-lg">
      <div class="flex justify-between mb-2 text-sm">
        <span>Subtotal (Comida)</span>
        <span>$<span x-text="desglose.subtotal.toLocaleString()"></span></span>
      </div>
      <div class="flex justify-between mb-2 text-sm" x-show="desglose.empaque > 0">
        <span>Costo Empaque (Desechables)</span>
        <span>$<span x-text="desglose.empaque.toLocaleString()"></span></span>
      </div>
      <div class="flex justify-between mb-4 text-sm" x-show="desglose.salsas > 0">
        <span>Salsas Extra (+2 Gratis)</span>
        <span>$<span x-text="desglose.salsas.toLocaleString()"></span></span>
      </div>
      <div class="flex justify-between font-display text-2xl border-t border-[#624735] pt-4 mb-6 text-acento">
        <span>TOTAL</span>
        <span>$<span x-text="desglose.total.toLocaleString()"></span></span>
      </div>
      
      <button @click="enviar" :disabled="enviando || carrito.length === 0" class="w-full bg-acento text-white font-display text-xl py-4 rounded-md shadow-md hover:bg-yellow-600 transition disabled:opacity-50 flex justify-center items-center gap-2">
        <span x-show="!enviando">CONFIRMAR ORDEN 🚀</span>
        <span x-show="enviando" class="loader ease-linear rounded-full border-2 border-t-2 border-white h-6 w-6"></span>
      </button>
    </div>
  </div>

  <button @click="vista = 'checkout'" x-show="vista === 'catalogo' && carrito.length > 0" x-transition.scale.origin.bottom.right class="fixed bottom-6 right-6 bg-oscuro text-white px-6 py-4 rounded-full shadow-2xl font-bold font-display text-lg hover:scale-105 transition flex items-center gap-3 z-50 border-2 border-acento">
    <span>🛒</span>
    <span class="bg-danger px-2 py-0.5 rounded-full text-sm" x-text="carrito.reduce((acc, item) => acc + item.cant, 0)"></span>
    <span>$<span x-text="desglose.total.toLocaleString()"></span></span>
  </button>

  <script>
    function menuApp() {
      return {
        productos: [],
        categoriasUnicas: [],
        carrito: [],
        cliente: {
          nombre: '', celular: '', tipo_pedido: 'LOCAL', direccion: '', metodo_pago: 'EFECTIVO', notas: ''
        },
        cargando: true,
        enviando: false,
        vista: 'catalogo', 
        
        init() {
          if (typeof google !== 'undefined') {
            google.script.run.withSuccessHandler(res => {
              this.procesarMenu(res);
            }).obtenerMenuPOS();
          } else {
            // Mock Data
            setTimeout(() => {
              this.procesarMenu([
                { nombre: 'BURGER PRIME', precio: 19000, categoria: 'PRINCIPAL' },
                { nombre: 'CHEESEBURGER', precio: 15000, categoria: 'PRINCIPAL' },
                { nombre: 'PAPAS FRITAS', precio: 5000, categoria: 'ADICION' },
                { nombre: 'SALSA AJO', precio: 500, categoria: 'SALSA' },
                { nombre: 'SALSA BBQ', precio: 500, categoria: 'SALSA' },
                { nombre: 'COCA COLA', precio: 4000, categoria: 'BEBIDAS' }
              ]);
            }, 800);
          }
        },

        procesarMenu(datos) {
          this.productos = datos.filter(p => !['DOMICILIO', 'COSTO EMPAQUE'].includes(p.nombre.toUpperCase()));
          let categorias = this.productos.map(p => p.categoria || 'OTROS');
          this.categoriasUnicas = [...new Set(categorias)].sort((a,b) => {
            if(a === 'PRINCIPAL') return -1;
            if(b === 'PRINCIPAL') return 1;
            return a.localeCompare(b);
          });
          this.cargando = false;
        },

        scrollMenu() {
          document.getElementById('catalogo-grid').scrollIntoView({ behavior: 'smooth' });
        },

        agregar(prod) {
          let item = this.carrito.find(i => i.nombre === prod.nombre);
          if (item) item.cant++;
          else this.carrito.push({ ...prod, cant: 1 });
        },

        modificarCant(index, delta) {
          this.carrito[index].cant += delta;
          if (this.carrito[index].cant <= 0) this.carrito.splice(index, 1);
        },

        get desglose() {
          let subtotal = 0;
          let salsasTotal = 0;
          let contadorSalsas = 0;
          let empaque = (this.cliente.tipo_pedido === 'DOMICILIO' || this.cliente.tipo_pedido === 'PARA LLEVAR') ? 2000 : 0;

          this.carrito.forEach(item => {
            if (item.categoria === 'SALSA') {
              for (let i = 0; i < item.cant; i++) {
                if (contadorSalsas >= 2) salsasTotal += item.precio;
                contadorSalsas++;
              }
            } else {
              subtotal += (item.precio * item.cant);
            }
          });

          return { 
            subtotal: subtotal, 
            empaque: empaque, 
            salsas: salsasTotal, 
            total: subtotal + empaque + salsasTotal 
          };
        },

        enviar() {
          this.cliente.nombre = this.cliente.nombre.trim();
          this.cliente.celular = this.cliente.celular.trim();
          this.cliente.direccion = this.cliente.direccion.trim();

          if (!this.cliente.nombre || this.cliente.celular.length < 10) return alert("⚠️ Ingresa un nombre y un celular válido (10 dígitos).");
          if (this.cliente.tipo_pedido === 'DOMICILIO' && !this.cliente.direccion) return alert("⚠️ La dirección es obligatoria para domicilios.");

          this.enviando = true;
          
          let carritoEnvio = [];
          let contSalsas = 0;

          this.carrito.forEach(item => {
              let totalFila = 0;
              if (item.categoria === 'SALSA') {
                  for (let i = 0; i < item.cant; i++) {
                      if (contSalsas >= 2) totalFila += item.precio;
                      contSalsas++;
                  }
              } else {
                  totalFila = item.precio * item.cant;
              }
              carritoEnvio.push({
                 nombre: item.nombre,
                 cant: item.cant,
                 precioTotalCalculado: totalFila
              });
          });

          if (typeof google !== 'undefined') {
            google.script.run
              .withSuccessHandler(res => {
                this.enviando = false;
                alert("✅ ORDEN CONFIRMADA\nTu ID de seguimiento es: " + res.split('-').pop());
                this.carrito = [];
                this.cliente.notas = '';
                this.vista = 'catalogo';
                window.scrollTo(0,0);
              })
              .withFailureHandler(err => {
                this.enviando = false;
                alert("❌ Error procesando el pedido: " + (err.message || err));
              })
              .guardarPedidoPOS(this.cliente, JSON.stringify(carritoEnvio));
          } else {
            setTimeout(() => {
              alert("Payload simulado (Modo Desarrollo):\n" + JSON.stringify(carritoEnvio, null, 2));
              this.enviando = false;
            }, 1000);
          }
        }
      }
    }
  </script>
</body>
</html>
